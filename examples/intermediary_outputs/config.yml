################## SETUP ##################

################
# Data Sources #
################
data_sources:
    # run_dir is the path to the folder you want
    ### all the files associated with this configuration
    ### to be created in
    run_dir: .

    # nb_path_root is the path to the folder that cupid will
    ### look for your template notebooks in. It doesn't have to
    ### be inside run_dir, or be specific to this project, as
    ### long as the notebooks are there
    nb_path_root: ../../nblibrary

######################
# Computation Config #
######################

computation_config:

    # default_kernel_name is the name of the environment that
    ### the notebooks in this configuration will be run in by default.
    ### It must already be installed on your machine. You can also
    ### specify a different environment than the default for any
    ### notebook in NOTEBOOK CONFIG
    default_kernel_name: cupid-analysis

    # log level sets the level of how verbose logging will be.
    # options include: debug, info, warning, error
    log_level: 'info'

############# NOTEBOOK CONFIG #############

############################
# Notebooks and Parameters #
############################

# All parameters under global_params get passed to all the notebooks

global_params: # TODO: a lot of these params may be irrelevant/misleading for this notebook
  case_names:
    - 'b.e30_alpha09e_m.B1850C_MTso_Gris_Marbl.ne30_t233_wgx3.397'
    - 'b.e30_alpha09e_m.B1850C_MTso_Gris_Marbl.ne30_t233_wgx3.396'
    - 'b.e30_alpha10c.B1850C_MTso.ne30_t233_wgx3.402'
  case_nicknames:
    - '397'
    - '396'
    - '402'
  CESM_output_dir: ['/glade/derecho/scratch/hannay/archive',
                    '/glade/derecho/scratch/hannay/archive',
                    '/glade/derecho/scratch/hannay/archive']
  start_dates:
    - '0001-01-01'
    - '0001-01-01'
    - '0001-01-01'
  end_dates:
    - '0133-01-01'
    - '0154-01-01'
    - '0105-01-01'
  climo_start_years:
    - 97
    - 118
    - 69
  climo_end_years:
    - 132
    - 153
    - 104
  case_align_years:
    - 0
    - 0
    - 93
  obs_data_dir: '/glade/campaign/cesm/development/cross-wg/diagnostic_framework/CUPiD_obs_data'
  ts_dir: '/glade/campaign/cesm/development/cross-wg/diagnostic_framework/CESM_output_for_testing' # If this is set to null, it will default to CESM_output_dir; if you don't have permissions to write to CESM_output_dir, you can specify a directory such as your scratch arcive directory
  lc_kwargs:
    threads_per_worker: 1

timeseries: # TODO: will need to update timeseries portion of this in next PR
  num_procs: 8
  ts_done: False
  overwrite_ts: False
  file_mode: 664
  dir_mode: 775
  file_group: cesm
  dir_group: cesm

  atm:
    vars: ['RESTOM','TS', 'ICEFRAC']
    derive_vars:
        RESTOM: ['FLNT','FSNT']
    hist_str: 'cam.h0a'
    start_years: [1,1,1]
    end_years: [100,60,113]
    slice_size: [10, 10, 10]
    level: 'lev'
    mapping_file: [Null, Null, Null]


  lnd:
    vars: []
    derive_vars: []
    hist_str: 'clm2.h0a'
    start_years: [1,1,1]
    end_years: [100,60,113]
    slice_size: [10, 10, 10]
    level: 'lev'

  ocn:
    vars: []
    derive_vars: []
    hist_str: 'h.z'
    start_years: [1,1,1]
    end_years: [100,60,113]
    slice_size: [10, 10, 10]
    level: 'lev'

  ice:
    vars: ['aice','hi','hs']
    derive_vars: []
    hist_str: 'cice.h'
    start_years: [1,1,1]
    end_years: [200,200,200]
    slice_size: [10, 10, 10]
    level: 'lev'

  glc:
    vars: []
    derive_vars: []
    hist_str: 'initial_hist'
    start_years: [1,1,1]
    end_years: [100,60,113]
    slice_size: [10, 10, 10]
    level: 'lev'

  rof:
    vars: []
    derive_vars: []
    hist_str: 'h0'
    start_years: [1,1,1]
    end_years: [100,60,113]
    slice_size: [10, 10, 10]
    level: 'lev'

compute_notebooks:

  # This is where all the notebooks you want run and their
  # parameters are specified. Several examples of different
  # types of notebooks are provided.

  # The first key (here infrastructure) is the name of the
  # notebook from nb_path_root, minus the .ipynb

    infrastructure:
      index:
        parameter_groups:
          none: {}

    atm:
      TimeSeriesPlots:
        parameter_groups:
          none:
            regridded_output:
              - False
              - False
              - False
            vars:
              TS: Global
              RESTOM: Global
              ICEFRAC: Lab Sea

    ice:
      Hemis_seaice_visual_compare_obs_lens:
        parameter_groups:
          none:
            climo_nyears: 35
            grid_file: '/glade/campaign/cesm/community/omwg/grids/tx2_3v2_grid.nc'
            path_model: '/glade/campaign/cesm/development/cross-wg/diagnostic_framework/CUPiD_model_data/ice/'
      seaice_metrics:
        parameter_groups:
          none:
            climo_nyears: 35
            grid_file: '/glade/campaign/cesm/community/omwg/grids/tx2_3v2_grid.nc'
            path_model: '/glade/campaign/cesm/development/cross-wg/diagnostic_framework/CUPiD_model_data/ice/'


########### JUPYTER BOOK CONFIG ###########

##################################
# Jupyter Book Table of Contents #
##################################
book_toc:

  # See https://jupyterbook.org/en/stable/structure/configure.html for
  # complete documentation of Jupyter book construction options

  format: jb-book

  # All filenames are notebook filename without the .ipynb, similar to above

  root: infrastructure/index # root is the notebook that will be the homepage for the book
  parts:

    # Parts group notebooks into different sections in the Jupyter book
    # table of contents, so you can organize different parts of your project.
    # Each chapter is the name of one of the notebooks that you executed
    # in compute_notebooks above, also without .ipynb

    - caption: Diagnostic Output from the Atmosphere
      chapters:
        - file: atm/TimeSeriesPlots
    - caption: Sea Ice
      chapters:
        - file: ice/seaice_metrics
        - file: ice/Hemis_seaice_visual_compare_obs_lens


#####################################
# Keys for Jupyter Book _config.yml #
#####################################
book_config_keys:

  title: CESM Intermediate Diagnostic Output   # Title of your jupyter book
